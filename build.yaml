# Build matrix for GitHub Actions.
#
# Hardware: Corne (crkbd) with ProMicro/SuperMini nRF52840 controllers
# (nice!nano v2 compatible) and 128x32 SSD1306 OLED displays on both halves.
# The OLED is switched on with CONFIG_ZMK_DISPLAY=y in config/corne.conf; the
# Corne shield already describes it, so no display shield is needed here.
#
# Each entry produces one .uf2 file. The artifact name is what you will see
# inside the firmware zip downloaded from the Actions run.
#
# `settings_reset` is a tiny firmware that wipes stored Bluetooth bonds. Flash
# it to BOTH halves (then re-flash the real firmware) whenever the halves stop
# pairing with each other. See README.md.
---
include:
  - board: nice_nano_v2
    shield: corne_left
    artifact-name: corne_left
  - board: nice_nano_v2
    shield: corne_right
    artifact-name: corne_right
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
