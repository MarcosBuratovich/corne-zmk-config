# Corne firmware configuration (applies to both halves).
# Reference: https://zmk.dev/docs/config

# ---------------------------------------------------------------------------
# Display: 128x32 SSD1306 OLED on each half, drawn by the nice!oled module
# ---------------------------------------------------------------------------
# The nice_oled shield (build.yaml) turns the OLED on and installs its custom
# status screen. All options: https://github.com/mctechnology17/zmk-nice-oled
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Modifier icons in Windows/Linux style (Ctrl, Win) instead of Mac symbols.
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_WINDOWS=y

# Right half animation. Default is the cat. To pick another, set CAT=n and
# exactly one of the others =y.
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_HEAD=y
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=y
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=y

# Left half typing widget: speedometer with the WPM number and Luna the dog.
# (The module's own default is bongo cat with no speedometer.) To switch to
# bongo cat, set LUNA=n and BONGO_CAT=y.
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n

# ---------------------------------------------------------------------------
# Bluetooth radio transmit power
# ---------------------------------------------------------------------------
# ZMK defaults to 0 dBm. Raising it to +8 dBm (the nRF52840 maximum)
# strengthens the link between the two halves AND the link to the computer.
# Power draw difference is negligible. This is the ZMK-documented fix for
# halves that drop connection when moved apart:
# https://zmk.dev/docs/troubleshooting/connection-issues#unreliableweak-connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ---------------------------------------------------------------------------
# Optional: connection to the computer (not the split link)
# ---------------------------------------------------------------------------
# If the keyboard drops or stutters against the COMPUTER (not between halves),
# uncomment this. It disables the 2M PHY, which some hosts handle badly.
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ---------------------------------------------------------------------------
# Optional: battery life
# ---------------------------------------------------------------------------
# Deep sleep after 15 minutes idle. Waking takes a keypress and ~1 second.
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
